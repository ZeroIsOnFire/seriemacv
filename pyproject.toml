[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seriemacv"
version = "0.1.0"
description = "Local-first career workspace"
authors = [{ name = "Eli Fachin Junior" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "playwright>=1.50,<2",
    "pydantic>=2.12,<3",
    "python-docx>=1.2,<2",
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<3",
    "ruff>=0.12,<1",
]

[project.scripts]
seriemacv = "seriemacv.cli:main"
seriemacv-mcp = "seriemacv.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seriemacv = [
    "assets/styles/*/*.yml",
    "assets/styles/*/*.html",
    "assets/styles/*/*.css",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = [
    "src/seriemacv/application_ai.py",
    "src/seriemacv/browser.py",
    "src/seriemacv/diagnostics.py",
    "src/seriemacv/evidence_search.py",
    "src/seriemacv/i18n.py",
    "src/seriemacv/matching.py",
    "src/seriemacv/mcp.py",
    "src/seriemacv/privacy.py",
    "src/seriemacv/project.py",
    "src/seriemacv/studio.py",
    "src/seriemacv/styles.py",
]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
