[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seriemacv"
version = "0.1.0"
description = "Local-first career workspace"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
]

[project.scripts]
seriemacv = "seriemacv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
