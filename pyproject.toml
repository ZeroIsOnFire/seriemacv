[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seriemacv"
version = "0.1.0"
description = "Local-first career workspace"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "ruamel.yaml>=0.18,<0.19",
]

[project.scripts]
seriemacv = "seriemacv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
