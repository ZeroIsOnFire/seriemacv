schema_version: 1
id: clean
name: Clean
description: Neutral single-column resume optimized for broad ATS compatibility.
layout: single-column
page_size: A4
ats_safe: true
supported_sections: [summary, experience, education, skills, languages]
supported_formats: [markdown, html, pdf, docx]
markdown_variant: standard
tokens:
  font_family: Arial
  body_size_pt: 10.0
  name_size_pt: 22.0
  section_size_pt: 14.0
  record_size_pt: 11.0
  margins_mm: 16.0
  line_spacing: 1.35
  section_spacing_pt: 18.0
  primary_color: '000000'
  accent_color: '777777'
  header_alignment: left
  section_divider: line
  sidebar_width_mm:
