name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m ruff format --check src/seriemacv/diagnostics.py src/seriemacv/privacy.py tests/test_privacy.py
      - name: Check types
        run: python -m mypy src/seriemacv/diagnostics.py src/seriemacv/privacy.py
      - name: Test
        run: python -m unittest discover -s tests -v
