services:
  model-download:
    image: curlimages/curl:8.12.1
    environment:
      NUEXTRACT_GGUF_PATH: ${NUEXTRACT_GGUF_PATH:-/models/NuExtract3-Q4_K_M.gguf}
      NUEXTRACT_GGUF_URL: ${NUEXTRACT_GGUF_URL:-https://huggingface.co/numind/NuExtract3-GGUF/resolve/main/NuExtract3-Q4_K_M.gguf}
    volumes:
      - nuextract_models:/models
      - ./models:/external:ro
    command:
      - /bin/sh
      - -ec
      - |
        if [ -s "$$NUEXTRACT_GGUF_PATH" ]; then exit 0; fi
        if [ "$$NUEXTRACT_GGUF_PATH" != "/models/NuExtract3-Q4_K_M.gguf" ]; then
          echo "NUEXTRACT_GGUF_PATH does not exist: $$NUEXTRACT_GGUF_PATH" >&2
          exit 1
        fi
        curl --fail --location --retry 3 --output "$$NUEXTRACT_GGUF_PATH.part" "$$NUEXTRACT_GGUF_URL"
        mv "$$NUEXTRACT_GGUF_PATH.part" "$$NUEXTRACT_GGUF_PATH"
  nuextract:
    build:
      context: .
    image: seriemacv/nuextract-server:local
    ports:
      - "127.0.0.1:${NUEXTRACT_PORT:-8080}:8080"
    volumes:
      - nuextract_models:/models:ro
      - ./models:/external:ro
    environment:
      NUEXTRACT_GGUF_PATH: ${NUEXTRACT_GGUF_PATH:-/models/NuExtract3-Q4_K_M.gguf}
    depends_on:
      model-download:
        condition: service_completed_successfully
    command:
      - -m
      - ${NUEXTRACT_GGUF_PATH:-/models/NuExtract3-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${NUEXTRACT_CONTEXT_SIZE:-8192}"
      - -ngl
      - "${NUEXTRACT_GPU_LAYERS:-0}"
    restart: unless-stopped

volumes:
  nuextract_models:
    name: seriemacv_nuextract_models
